# Managed by mi-examples-workflows. Do not edit by hand: change
# .github/mi-examples-workflows.json and re-run `npx github:mi-examples/mi-examples-workflows`,
# or merge the sync pull request.

name: CI

# Shared pull-request CI: https://github.com/mi-examples/mi-examples-workflows/blob/main/docs/workflows.md#node-ciyml

on:
  pull_request:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: mi-examples/mi-examples-workflows/.github/workflows/node-ci.yml@e9dbb3ff76c930e744437d1c52e2654f864c404f # v0.6.0
    with:
      dist-dir: "dist"
      free-disk-space: true
      pre-test-commands: "npm install --prefix tests/test-nextjs --no-audit --package-lock=false\nnpm install --prefix tests/test-commonjs --no-audit --package-lock=false\nnpm install --prefix tests/test-nextjs-cjs --no-audit --package-lock=false"
      extra-scripts: "test:e2e\ntest:e2e:browser"
      env-vars: "PLAYWRIGHT_USE_SYSTEM_CHROME=1"
      audit-command: "npm run audit:all"
      timeout-minutes: 30
