name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit dependencies
        run: npm run audit:all

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [[ ! -d "dist" ]]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build verification passed"

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Build
        run: npm run build

      - name: Install E2E fixture dependencies
        run: |
          npm install --prefix tests/test-nextjs --no-audit --package-lock=false
          npm install --prefix tests/test-commonjs --no-audit --package-lock=false
          npm install --prefix tests/test-nextjs-cjs --no-audit --package-lock=false

      - name: Run unit and integration tests
        run: npm run test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run browser E2E tests
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
        run: npm run test:e2e:browser

  # Runs in-workflow (not via a separate workflow_run-triggered workflow) specifically so
  # GITHUB_REF reflects the actual push to develop. workflow_run jobs run from the default
  # branch's copy of the workflow file and don't reliably carry the triggering branch's ref
  # context — semantic-release/env-ci picked up "main" there even with GITHUB_REF forced to
  # develop in the job's own `env:`, silently skipping every beta release (see release-beta.yml
  # for the manual-retry fallback this leaves in place).
  release-beta:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: release-beta
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch --all --tags

      - name: Release Beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
