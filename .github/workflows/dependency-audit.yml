name: Dependency audit

# Weekly npm audit of the default branch, to catch advisories published after
# a dependency was installed. Pull requests are audited by CI.
# https://github.com/mi-examples/mi-examples-workflows/blob/main/docs/workflows.md#dependency-audityml

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Dependency audit
    permissions:
      contents: read
    uses: mi-examples/mi-examples-workflows/.github/workflows/dependency-audit.yml@abfcba1c04c439650b04679302ad3d9d5f5f4cf1 # v0.7.1
    with:
      audit-command: "npm run audit:all"
