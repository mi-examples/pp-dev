name: Secret scan

# Shared gitleaks scan: https://github.com/mi-examples/mi-examples-workflows/blob/main/docs/workflows.md#secret-scanyml

on:
  pull_request:
    branches: [main, develop]

permissions: {}

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    permissions:
      contents: read
    uses: mi-examples/mi-examples-workflows/.github/workflows/secret-scan.yml@9ce544b1c338f2946c68fe22017a118e2b5f3a8f # v0.7.0
